apiVersion: primitives.telara.dev/v3
kind: Primitive
metadata:
  publisher: examples.telara.dev
  name: browser-form-review
  version: 0.1.1
  description: Fill and review a form in a disposable local fixture.
  license: MIT
interface:
  inputSchema:
    type: object
    additionalProperties: false
    properties:
      base_url: {type: string, description: "Local fixture origin, such as http://127.0.0.1:4173"}
      project: {type: string, minLength: 1, maxLength: 60}
      summary: {type: string, minLength: 1, maxLength: 160}
    required: [base_url, project, summary]
  outputSchema:
    type: object
    additionalProperties: false
    properties:
      status: {type: string}
      review: {type: string}
    required: [status, review]
execution: {entrypoint: main.py}
provenance: {source: main.py, toolchain: "TAP CPython 3.12 WASM", build: "none: Python source runs in the TAP sandbox"}
tools:
  - {alias: navigate, capability: playwright.browser.navigate, effect: write, pin: {server: Playwright, tool: browser_navigate}}
  - {alias: type, capability: playwright.browser.type, effect: write, pin: {server: Playwright, tool: browser_type}}
  - {alias: click, capability: playwright.browser.click, effect: write, pin: {server: Playwright, tool: browser_click}}
  - {alias: snapshot, capability: playwright.browser.snapshot, effect: read, pin: {server: Playwright, tool: browser_snapshot}}
