apiVersion: primitives.telara.dev/v3
kind: Primitive
metadata:
  publisher: dev.telara
  name: connector-draft-reply
  version: 0.2.1
  description: Create one unsent Gmail draft from caller-supplied content.
  output_description: Draft id and status only; this primitive never sends email.
interface:
  inputSchema:
    type: object
    properties:
      to: {type: string, minLength: 3, maxLength: 254}
      subject: {type: string, minLength: 1, maxLength: 160}
      body: {type: string, minLength: 1, maxLength: 4000}
      thread_id: {type: string, maxLength: 200}
    required: [to, subject, body]
  outputSchema:
    type: object
    properties:
      draft_id: {type: string}
      status: {const: unsent_draft_created}
    required: [draft_id, status]
execution:
  entrypoint: main.py
  timeoutSeconds: 30
  limits: {max_dispatches: 1}
tools:
  - alias: create_draft
    capability: gmail.drafts.create
    effect: write
capabilities:
  - label: gmail.drafts.create
    id: sha256:6bfb37369b9d59cc91fe01910de2b69ece882314b8dd5d022911fc8ee239c52d
    question: Create an unsent Gmail draft from a structured message encoded as JSON.
    args:
      type: object
      properties: {message: {type: string}}
      required: [message]
    result:
      type: object
