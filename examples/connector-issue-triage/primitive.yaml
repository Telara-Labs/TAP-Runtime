apiVersion: primitives.telara.dev/v3
kind: Primitive
metadata:
  publisher: dev.telara
  name: connector-issue-triage
  version: 0.2.1
  description: Summarize a bounded Jira JQL result set for human triage.
  output_description: At most ten Jira issue keys, summaries, statuses and priorities; no issue creation or update.
interface:
  inputSchema:
    type: object
    properties:
      jql: {type: string, minLength: 1, maxLength: 500}
      max_results: {type: integer, minimum: 1, maximum: 10}
    required: [jql]
  outputSchema:
    type: object
    properties:
      returned: {type: integer}
      issues: {type: array, items: {type: object}}
    required: [returned, issues]
execution:
  entrypoint: main.py
  timeoutSeconds: 30
  limits: {max_dispatches: 1}
tools:
  - alias: search_issues
    capability: jira.issues.search
    effect: read
capabilities:
  - label: jira.issues.search
    id: sha256:3d7e996a8b1a26e3be7af139c8a9290a40ef50fd9b6dcc1c82fc15dd7d133e1b
    question: Search Jira issues using the caller's bounded JQL query.
    args:
      type: object
      properties:
        jql: {type: string}
        max_results: {type: integer}
        mode: {type: string}
      required: [jql, max_results, mode]
    result:
      type: object
      properties: {issues: {type: array, items: {type: object}}}
      required: [issues]
