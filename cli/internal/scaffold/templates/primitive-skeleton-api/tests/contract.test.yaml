# Contract tests — run by `tap test` against fixtures, offline, no credentials.
# Assertion discipline (see agents/grader.md): tests must fail on "schema-shaped but semantically
# wrong" output, and must include negative cases. Delete these REPLACE cases and write real ones —
# do not ship a package with placeholder assertions.

cases:
  - name: REPLACE_happy_path_case_name
    fixtures: fixtures/REPLACE.json
    expect:
      output_schema_valid: true
      output:
        REPLACE_TOP_LEVEL_FIELD: REPLACE_EXPECTED_VALUE
    assert:
      - "REPLACE — a containment/ordering claim that would fail on a plausible-but-wrong output"

  # REQUIRED: at least one negative requirements case — the primitive must error cleanly and by
  # name, never degrade silently, when a declared input/credential/host is missing or out of bounds.
  - name: missing_required_input_fails_at_gate
    input: {}
    expect:
      error: schema_invalid
      steps_executed: 0

  # The skeleton workflow ships a reason_unknown step (see workflow.yaml) — keep BOTH of these
  # uncommented and filled in unless you deleted that step (and its matched set of four edits).
