apiVersion: primitives.telara.dev/v1
kind: Workflow

inputs:
  REPLACE_INPUT_NAME:
    type: string
    required: true
    description: REPLACE — shape only, no example live values beyond a format hint
    examples: ["REPLACE-EXAMPLE-SHAPE"]
  # Add optional inputs with defaults as needed, e.g.:
  # limit:
  #   type: int
  #   default: 20
  #   min: 1
  #   max: 100
  # `object` is also a valid type (v1 ruling 5) for a structured, non-scalar input.
  #
  # RESERVED: `now` (v1 ruling 3) is an ISO-8601 datetime the runtime auto-stamps every run --
  # usable as {from: inputs.now} WITHOUT declaring it here at all. If a staleness/monitoring
  # primitive needs it, reference it directly; do not declare it `required: true` if you do
  # declare it for documentation purposes -- `tap validate` rejects that (a caller never supplies
  # it).

steps:
  # 1. Fetch. Unprefixed tool name; credential: names the abstract slot from primitive.yaml.
  - id: fetch
    api:
      integration: REPLACE_INTEGRATION
      tool: REPLACE_TOOL                     # unprefixed — executor adds the integration prefix
      credential: REPLACE_SLOT
      params:
        REPLACE_PARAM: {from: inputs.REPLACE_INPUT_NAME}
      # paginate: all                         # uncomment + declare pagination.* in requires_features if paginated
    retry: {max_attempts: 3, initial_backoff_seconds: 2, retry_on: [timeout, unavailable, rate_limit]}

  # 2. Deterministic classification/shaping. Prefer signature/known-string matching over reasoning
  #    — see references/workflow-authoring.md §2 (the deterministic-first ladder). Put a data table
  #    in src/ and reference it with `*_from:`, don't inline it here.
  - id: classify
    transform:
      language: starlark
      expression_from: src/classify.star
      params:
        items: {from: steps.fetch.items}
        # signatures_from: src/signatures.yaml   # uncomment if using a known-signature table

  # 3. Bounded reasoning fallback for genuinely unmatched cases ONLY. This step, the `reasoning:`
  #    block in primitive.yaml, the `reasoned` param on the verdict step below, and its handling in
  #    verdict.star are a matched set — if step 2 fully classifies everything in your task, DELETE
  #    ALL FOUR together (this step, that primitive.yaml block, the `reasoned:` line below, and the
  #    `_reasoned_records` call in verdict.star). Leaving `reasoned: {from: steps.reason_unknown}`
  #    pointed at a deleted step is a dangling reference that fails tap validate's from: resolution
  #    lint — don't delete only the step and forget the other three.
  - id: reason_unknown
    when: steps.classify.has_unclassified == true
    reason:
      purpose: REPLACE_PURPOSE
      input: {from: steps.classify.unclassified}
      inputSchema: {type: array, items: {type: object}}
      outputSchema: {type: array, items: {type: object, required: [REPLACE], properties: {}}}
      maxTokens: REPLACE_INT
      capabilities: [structured-output]
      dataClasses: [REPLACE_DATA_CLASS]

  # 4. Merge deterministic + (optional) reasoned results into the final shape. `reasoned` is null
  #    when step 3 is skipped by `when:` at runtime — handle that explicitly in verdict.star, don't
  #    assume it ran.
  - id: verdict
    transform:
      language: starlark
      expression_from: src/verdict.star
      params:
        classified: {from: steps.classify.classified}
        reasoned: {from: steps.reason_unknown}   # null when step 3's when: guard skips it at runtime — verdict.star handles it

outputs:
  REPLACE_OUTPUT_NAME: {from: steps.verdict.REPLACE_FIELD}
