# Contract tests — offline, no browser, no credentials: browser-step fixtures replay captured
# extraction results; lease fixtures mock the fallback. Delete these REPLACE cases and write real
# ones — do not ship a package with placeholder assertions.

cases:
  - name: cached_fast_path_uses_zero_reasoning
    fixtures: fixtures/REPLACE_cached_extraction.json
    expect:
      output_schema_valid: true
      lease_invoked: false
      output:
        extraction.mode: cached_selectors
        extraction.drift_detected: false

  - name: drift_falls_back_to_lease_and_proposes_repair
    fixtures: fixtures/REPLACE_drifted_page.json
    lease_mock: reasoning_lease_response
    expect:
      output_schema_valid: true
      lease_invoked: true
      lease_input_max_chars: 20000            # capture bound respected
      drift_event_emitted: true                # repair proposal opened, prod untouched
      output:
        extraction.mode: reasoning_fallback
        extraction.repair_proposed: true

  - name: anti_bot_page_is_drift_not_retry
    fixtures: fixtures/REPLACE_drifted_page.json
    fixture_variant: anti_bot
    expect:
      browser_retries: 0                       # challenge pages must not be hammered
      drift_event_emitted: true

  # REQUIRED: negative case — the primitive must refuse cleanly at the step boundary, before any
  # navigation, when the input URL falls outside the bound origin.
  - name: url_outside_bound_origin_blocked_at_step
    input: {url: "https://REPLACE-outside-bound-origin.example"}
    expect:
      error: origin_blocked
      steps_executed: 0
