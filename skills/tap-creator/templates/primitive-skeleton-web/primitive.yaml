apiVersion: primitives.telara.dev/v1
kind: Primitive

metadata:
  name: REPLACE_KEBAB_NAME                # e.g. web-changelog-watch
  publisher: dev.telara                    # reverse-DNS, domain-verified; full id is <publisher>/<name>
  version: 0.1.0
  description: >-
    REPLACE. Describe SHAPE and EFFECT only: what page it watches/reads and what it returns.
    State plainly that it navigates and reads within the bound origin only — never clicks through
    to other sites, submits forms, or downloads files (adjust to match what requirements.browser
    actually declares below). No IDs, no live URLs, no "if this fails, try..." language.
  output_description: >-
    REPLACE. Describe the output shape, sort order, and documented empty cases, plus that the
    output reports whether cached selectors or the reasoning fallback produced each entry.
  license: Apache-2.0
  source: REPLACE_GIT_URL
  artifactDigest: sha256:TBD-at-publish
  forkOf: null

interface:
  inputSchema:
    $ref: schemas/input.json
  outputSchema:
    $ref: schemas/output.json

requirements:
  browser:
    session: none                          # public web by design; authenticated sessions are
                                             # out of scope per the current TAP design (ask the
                                             # user rather than authoring around this if the task
                                             # genuinely needs a logged-in session)
    origins:
      - slot: REPLACE_ORIGIN_SLOT           # ORIGIN SLOT — bound at install to exact origin(s),
                                              # e.g. https://docs.example.com. The input `url` is
                                              # runtime-checked to be within the bound origins;
                                              # outside -> origin_blocked at the step boundary.
    navigation: same_origin_only
    downloads: false
    uploads: false
    clipboard: false
  network:
    egressHosts: []                         # [] — browser step only, no direct API egress
  credentials: []                            # [] — public pages; add entries only for a mixed
                                               # API+browser primitive (see SKILL.md step 2)
  reasoning:
    provider: caller
    capabilities: [structured-output]
    maxTokens: REPLACE_INT                    # extraction fallback over page text can run larger
                                                # than a typical classification lease

effects:
  class: read
  idempotent: true
  # NOTE: no `destructive:` field -- removed in v1 (ruling 1); `class` carries severity alone.

execution:
  runtime: telara-workflow-v1
  entrypoint: workflow.yaml
  timeoutSeconds: 90
  resumable: false                            # compiler-derived; leave false for read-class v0.1
  may_suspend: []                              # compiler-derived
  requires_features: [browser.read, transform.starlark, lease, origin_slots]

suggested_mode: autonomous
