name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing signed GitHub release tag to publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out packaging source
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.8"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Download and verify existing signed release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected a semantic version tag such as v1.2.3; got $RELEASE_TAG" >&2
            exit 1
          fi
          mkdir -p dist
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir dist
          go run ./release verify --dir dist --pub release/release.pub

      - name: Test npm packaging
        run: node --test npm/test/*.test.cjs

      - name: Stage npm package
        run: node npm/pack.cjs dist "$RUNNER_TEMP/tap-npm-package"

      - name: Match package version to release tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          expected="${RELEASE_TAG#v}"
          actual="$(node -p "require('$RUNNER_TEMP/tap-npm-package/package.json').version")"
          if [ "$actual" != "$expected" ]; then
            echo "Release tag $RELEASE_TAG contains runner version $actual" >&2
            exit 1
          fi

      - name: Set up npm Trusted Publishing
        run: npm install --global npm@11.5.1

      - name: Publish package
        run: npm publish "$RUNNER_TEMP/tap-npm-package" --access public
