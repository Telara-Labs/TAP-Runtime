name: CI

# Builds and tests the runner and its two modules (contract, discover) on
# every push and pull request, from public sources only.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GOWORK: "off"
  GOFLAGS: "-mod=readonly"

jobs:
  unix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.1"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Test the VS Code extension
        run: node --test vscode/extension.test.js
      - name: Tools the store readers use (sqlite3, zstd)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sqlite3 zstd
      - name: Format
        run: test -z "$(gofmt -l acceptance bind bridge conformance contract host journal release satisfy guest-sh internal discover)"
      - name: Vet
        run: go vet ./... && (cd contract && go vet ./...) && (cd discover && go vet ./...)
      - name: Build the Bash interpreter
        run: GOOS=wasip1 GOARCH=wasm go build -o /dev/null ./guest-sh
      # contract/buildbox is the Linux build sandbox agent-service runs; its
      # tests copy the host's /usr into a root, which on a hosted runner is
      # tens of gigabytes. Telara's own Linux CI runs it on every push.
      - name: Test contract
        run: cd contract && go test $(go list ./... | grep -v /buildbox) -count=1
      - name: Test discover
        run: cd discover && go test ./... -count=1
      - name: Test the runner
        run: go test ./bind ./bridge ./conformance ./host ./journal ./release ./satisfy -count=1

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.1"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Test the VS Code extension
        run: node --test vscode/extension.test.js
      # The runner's suite drives Unix programs, and contract's build box and
      # rebuild are the Linux build sandbox: on Windows the portable packages
      # run, discover runs in full, and the runner and interpreter build (as
      # Telara's own Windows CI does).
      - name: Test contract and discover
        shell: bash
        run: (cd contract && go test ./glob ./manifest -count=1) && (cd discover && go test ./... -count=1)
      - name: Test the runner's portable packages
        run: go test ./bind ./journal ./satisfy -count=1
      - name: Test the Windows dialing guard
        run: go test ./host -count=1 -run '^(TestDeclarationsThatCannotBeMeantAreRefused|TestANameThatResolvesToTheMachineItselfIsNotReached|TestADeclaredLoopbackOriginStillWorks|TestAFetchGoesThroughAProxyTheEnvironmentNames|TestAProxyDoesNotLetAnOriginBeAMetadataAddress)$'
      - name: Build the runner and the Bash interpreter
        shell: bash
        run: go build -o tap.exe ./host && GOOS=wasip1 GOARCH=wasm go build -o sh.wasm ./guest-sh
