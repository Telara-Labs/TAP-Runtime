name: CI

# Builds and tests the runner and its two modules (contract, discover) on
# every push and pull request, from public sources only.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GOWORK: "off"
  GOFLAGS: "-mod=readonly"

jobs:
  unix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.9"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Test the VS Code extension
        run: node --test vscode/extension.test.js
      - name: Test the npm launcher
        run: node --test npm/test/*.test.cjs
      - name: Check public commit messages
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
            head_sha="${{ github.event.pull_request.head.sha }}"
            base_sha="$(git merge-base "$base_sha" "$head_sha")"
          else
            base_sha="${{ github.event.before }}"
            head_sha="${{ github.sha }}"
          fi
          if [ "$base_sha" = "0000000000000000000000000000000000000000" ]; then
            base_sha="$(git rev-parse "${head_sha}^")"
          fi
          go run ./cmd/public-check --commit-base "$base_sha" --commit-head "$head_sha"
      - name: Tools the store readers use (sqlite3, zstd)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sqlite3 zstd
      - name: Format
        run: test -z "$(gofmt -l acceptance bind bridge cmd conformance contract host internal journal release satisfy guest-sh sdk/go/tap discover)"
      - name: Vet
        run: go vet ./... && (cd contract && go vet ./...) && (cd discover && go vet ./...)
      - name: Check known Go vulnerabilities
        if: runner.os == 'Linux'
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
          (cd contract && go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...)
          (cd discover && go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...)
      - name: Build the Bash interpreter
        run: GOOS=wasip1 GOARCH=wasm go build -o /dev/null ./guest-sh
      # contract/buildbox is the Linux build sandbox agent-service runs; its
      # tests copy the host's /usr into a root, which on a hosted runner is
      # tens of gigabytes. Telara's own Linux CI runs it on every push.
      - name: Test contract
        run: cd contract && go test $(go list ./... | grep -v /buildbox) -count=1
      - name: Test discover
        run: cd discover && go test ./... -count=1
      - name: Test Python examples and language harness
        run: |
          python3 -B -m unittest discover -s examples/browser-support -v
          python3 -B -m unittest discover -s examples/desktop-support -v
          python3 -B -m unittest discover -s examples/api-release-brief -v
          python3 -B -m unittest discover -s examples/connector-meeting-brief -v
          python3 -B -m unittest discover -s examples/connector-draft-reply -v
          python3 -B -m unittest discover -s examples/connector-issue-triage -v
          python3 -B -m unittest discover -s examples/languages -p 'test_*.py' -v
      # The component tests build real WASI Preview 1 modules and Preview 2
      # components with rustc, and Preview 3 components with the beta
      # toolchain (wasm32-wasip3 is not in a stable release yet); without
      # these targets they skip.
      - name: Rust WASI targets
        run: |
          rustup target add wasm32-wasip1 wasm32-wasip2
          rustup toolchain install beta --profile minimal --target wasm32-wasip3
      # The C++ tests build with wasm32-wasip1-clang++ from wasi-sdk; without
      # it they skip. The Windows job does not install it and keeps skipping
      # them.
      - name: Install wasi-sdk 34
        run: |
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64) asset=wasi-sdk-34.0-x86_64-linux ;;
            Linux-ARM64) asset=wasi-sdk-34.0-arm64-linux ;;
            macOS-ARM64) asset=wasi-sdk-34.0-arm64-macos ;;
            macOS-X64) asset=wasi-sdk-34.0-x86_64-macos ;;
            *) echo "no wasi-sdk build for $RUNNER_OS-$RUNNER_ARCH"; exit 1 ;;
          esac
          curl -fsSL "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/$asset.tar.gz" -o "$RUNNER_TEMP/wasi-sdk.tar.gz"
          mkdir -p "$RUNNER_TEMP/wasi-sdk"
          tar -xzf "$RUNNER_TEMP/wasi-sdk.tar.gz" -C "$RUNNER_TEMP/wasi-sdk" --strip-components=1
          echo "$RUNNER_TEMP/wasi-sdk/bin" >> "$GITHUB_PATH"
      - name: Build the C++ language example
        run: python3 examples/languages/cpp/build.py
      - name: Build the Go language example
        run: GOOS=wasip1 GOARCH=wasm go build -C examples/languages/go -trimpath -buildvcs=false -o main.wasm .
      - name: Build the Rust language example
        run: python3 examples/languages/rust/build.py
      - name: Test the source-language examples with this checkout's runner
        run: |
          mkdir -p "${RUNNER_TEMP}/tap-language-cache/interpreters"
          go build -ldflags "-X main.testCacheRoot=${RUNNER_TEMP}/tap-language-cache" -o "${RUNNER_TEMP}/tap-language" ./host
          GOOS=wasip1 GOARCH=wasm go build -o "${RUNNER_TEMP}/tap-language-cache/interpreters/sh.wasm" ./guest-sh
          python3 -B examples/languages/test_languages.py --runner "${RUNNER_TEMP}/tap-language"
      - name: Test all root-module packages
        run: go test ./... -count=1 -timeout 20m

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.9"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Test the VS Code extension
        run: node --test vscode/extension.test.js
      - name: Test the npm launcher
        run: node --test npm/test/*.test.cjs
      # The runner's suite drives Unix programs, and contract's build box and
      # rebuild are the Linux build sandbox: on Windows the portable packages
      # run, discover runs in full, and the runner and interpreter build (as
      # Telara's own Windows CI does).
      - name: Test contract and discover
        shell: bash
        run: (cd contract && go test ./glob ./manifest -count=1) && (cd discover && go test ./... -count=1)
      - name: Test the runner's portable packages
        run: go test ./bind ./journal ./satisfy ./internal/publiccheck ./sdk/go/tap -count=1
      - name: Test native Windows acceptance helpers
        run: go test ./acceptance/launch -count=1
      - name: Test the Windows dialing guard
        run: go test ./host -count=1 -run '^(TestWindowsRedirectedTrustPromptRefusesBeforeOpeningConsole|TestDeclarationsThatCannotBeMeantAreRefused|TestANameThatResolvesToTheMachineItselfIsNotReached|TestADeclaredLoopbackOriginStillWorks|TestAFetchGoesThroughAProxyTheEnvironmentNames|TestAProxyDoesNotLetAnOriginBeAMetadataAddress)$'
      - name: Build the runner and the Bash interpreter
        shell: bash
        run: go build -o tap.exe ./host && GOOS=wasip1 GOARCH=wasm go build -o sh.wasm ./guest-sh
