apiVersion: primitives.telara.dev/v3
kind: Primitive
metadata: {publisher: dev.telara, name: deploy-check, version: 0.1.0}
entrypoint: main.sh
commands:
  - {command: git,     args: [log],    effect: read}
  - {command: kubectl, args: [get],    effect: read}
  - {command: kubectl, args: [delete], effect: destructive}
