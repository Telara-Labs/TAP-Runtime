stages: [probe]

ruleset-digest-probe:
  stage: probe
  image: golang:1.26.10
  tags: [telara-amd64]
  script:
    - cd discover
    - |
      set +e
      output="$(GOWORK=off GOFLAGS=-mod=readonly go test -p 1 -run '^TestRulesetDigestNeedsAnEpoch$' ./redact -count=1 2>&1)"
      status=$?
      set -e
      printf '%s\n' "$output"
      digest="$(printf '%s\n' "$output" | sed -n 's/.*append "46 \([0-9a-f]\{64\}\)".*/\1/p' | head -1)"
      test -n "$digest"
      printf '46 %s\n' "$digest" > ../ruleset-digest.txt
      printf '<testsuites tests="1" failures="0"><testsuite name="ruleset-digest" tests="1" failures="0"><testcase name="epoch-46-digest"><system-out>46 %s</system-out></testcase></testsuite></testsuites>\n' "$digest" > ../ruleset-digest.xml
  artifacts:
    when: always
    paths: [ruleset-digest.txt]
    reports:
      junit: ruleset-digest.xml
