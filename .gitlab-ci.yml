# Tests that need an installed client, or the network, skip themselves when
# there is none. Everything else runs real programs in the real sandbox.
stages: [verify]

variables:
  GOWORK: "off"
  GOFLAGS: "-mod=readonly"
  GOPRIVATE: gitlab.com/telara-labs/*
  GONOSUMDB: gitlab.com/telara-labs/*

# Every job runs on Telara's own runners on GCP, never on GitLab.com's shared
# ones (TENG-1863). Those runners are Linux.
default:
  tags: [telara-amd64]
  retry:
    max: 2
    when: runner_system_failure
  # As the other Telara repositories do on these runners: temporary files and
  # the build cache live in the project directory.
  before_script:
    - mkdir -p "${CI_PROJECT_DIR}/.tmp" "${CI_PROJECT_DIR}/.cache/go-build"
    - export TMPDIR="${CI_PROJECT_DIR}/.tmp" GOTMPDIR="${CI_PROJECT_DIR}/.tmp" GOCACHE="${CI_PROJECT_DIR}/.cache/go-build"
    # The runner takes contract/ as a module, at a published version.
    - git config --global url."https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/".insteadOf "https://gitlab.com/"

.suite: &suite
  - test -z "$(gofmt -l bind bridge conformance contract host journal release satisfy guest-sh)"
  - go vet ./bind ./bridge ./conformance/... ./host ./journal ./release ./satisfy ./guest-sh
  - (cd contract && go vet ./... && go test ./... -count=1)
  - GOOS=wasip1 GOARCH=wasm go build -o /dev/null ./guest-sh
  - go test ./bind ./bridge ./conformance ./host ./journal ./release ./satisfy -count=1

linux-amd64:
  stage: verify
  image: golang:1.26
  script: *suite

linux-arm64:
  stage: verify
  image: golang:1.26
  tags: [telara-arm64]
  script:
    - uname -m
    - *suite

# Telara has no Windows runner, so the Windows build is run under Wine on a
# Linux one. Wine implements the Windows API; it is not Windows. A pass here
# says the Windows build starts, reads and writes files, and holds a primitive
# to its declarations against Wine's implementation of those calls. It does
# not say the same of Windows itself.
#
# The suite drives Unix programs (tee, cat, grep), so the packages that touch
# no program are tested, the runner is built, and one primitive is run in the
# sandbox.
windows-amd64-wine:
  stage: verify
  image: golang:1.26-trixie
  variables:
    WINEDEBUG: "-all"
    WINEPREFIX: "/tmp/wine"
  artifacts:
    when: always
    paths: [windows.log]
    expire_in: 1 week
  script:
    - apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends wine wine64 > /dev/null
    - wine --version | tee windows.log
    - mkdir -p win store work/in
    - for p in bind journal satisfy; do GOOS=windows GOARCH=amd64 go test -c -o win/$p.test.exe ./$p; done
    - for p in glob manifest; do (cd contract && GOOS=windows GOARCH=amd64 go test -c -o ../win/$p.test.exe ./$p); done
    - GOOS=windows GOARCH=amd64 go build -o win/tap-runtime.exe ./host
    - GOOS=wasip1 GOARCH=wasm go build -o store/sh.wasm ./guest-sh
    - for p in bind journal satisfy contract/glob contract/manifest; do echo "== $p" | tee -a windows.log; (cd $p && wine "${CI_PROJECT_DIR}/win/$(basename $p).test.exe" -test.count=1 -test.v 2>&1 | tee -a "${CI_PROJECT_DIR}/windows.log" | tail -3; exit ${PIPESTATUS[0]}); done
    - echo "read-on-windows" > work/in/x.txt
    - cd work
    - wine ../win/tap-runtime.exe --interpreters ../store --runs ../runs --approve ../pkg/windows-smoke 2>&1 | tee -a ../windows.log
    - grep -q "written-on-windows" out/y.txt
    - test ! -e ../escaped.txt

# The same, on Windows itself. Manual, because it needs a Windows runner and
# Telara has none: playing it uses a GitLab.com shared runner.
windows-amd64:
  stage: verify
  when: manual
  allow_failure: true
  tags: [saas-windows-medium-amd64]
  artifacts:
    when: always
    paths: [windows.log]
    expire_in: 1 week
  script:
    - Start-Transcript -Path windows.log
    - choco install golang --version=1.26.1 -y --no-progress
    - $env:Path = "C:\Program Files\Go\bin;" + $env:Path
    - go version
    - go test ./bind ./journal ./satisfy -count=1
    - cd contract; go test ./glob ./manifest -count=1; cd ..
    - go build -o tap-runtime.exe ./host
    - $env:GOOS = "wasip1"; $env:GOARCH = "wasm"; go build -o store/sh.wasm ./guest-sh; Remove-Item Env:GOOS; Remove-Item Env:GOARCH
    - New-Item -ItemType Directory -Force -Path work/in | Out-Null
    - Set-Content -Path work/in/x.txt -Value "read-on-windows"
    - cd work
    - ../tap-runtime.exe --interpreters ../store --runs ../runs --approve ../pkg/windows-smoke
    - if ((Get-Content out/y.txt) -notmatch "written-on-windows") { throw "the approved write did not happen" }
    - if (Test-Path ../escaped.txt) { throw "a write left the declared directory" }
